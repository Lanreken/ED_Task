global:
  resolve_timeout: 5m

route:
  receiver: default-log
  group_by: ["alertname", "job", "service"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  routes:
    - matchers:
        - severity="critical"
      receiver: pagerduty-critical
      continue: true
    - matchers:
        - severity=~"warning|critical"
      receiver: slack-ops

receivers:
  - name: default-log

  - name: slack-ops
    slack_configs:
      - send_resolved: true
        api_url: ${SLACK_WEBHOOK_URL}
        channel: '#ops-alerts'
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts -}}
          *{{ .Labels.severity }}* {{ .Annotations.summary }}
          {{ "\n" }}{{ .Annotations.description }}
          {{ "\n" }}labels={{ .Labels }}
          {{ "\n\n" }}
          {{- end }}

  - name: pagerduty-critical
    pagerduty_configs:
      - send_resolved: true
        routing_key: ${PAGERDUTY_ROUTING_KEY}
        severity: critical
        description: '{{ .CommonAnnotations.summary }}'
        details:
          alertname: '{{ .CommonLabels.alertname }}'
          service: '{{ .CommonLabels.service }}'
          description: '{{ .CommonAnnotations.description }}'

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["alertname", "job"]
